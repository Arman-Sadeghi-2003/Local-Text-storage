<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text File Storage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Text File Storage</h1>
        
        <!-- Mode indicator -->
        <div id="modeIndicator" class="mode-indicator">
            <span id="modeText">Detecting mode...</span>
        </div>

        <!-- Form to save text -->
        <div class="form-section">
            <h2>Save New Text File</h2>
            <form id="saveForm">
                <input type="text" id="filename" placeholder="Enter filename" required>
                <textarea id="textContent" placeholder="Enter your text here..." required></textarea>
                <button type="submit">Save File</button>
            </form>
            <div id="message"></div>
        </div>

        <!-- List of saved files -->
        <div class="files-section">
            <h2>Saved Files</h2>
            <button id="refreshBtn">Refresh List</button>
            <div id="filesList"></div>
        </div>

        <!-- File viewer -->
        <div class="viewer-section">
            <div class="viewer-header">
                <h2>File Content</h2>
                <button id="copyBtn" class="copy-btn" style="display: none;">📋 Copy</button>
            </div>
            <div id="fileViewer">Select a file to view its content</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
